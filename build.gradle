ext {
    defaultVersionName = kotlin_version
}// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.7.10"
    repositories {
        google()
        maven {
            url "https://jcenter.bintray.com"
            allowInsecureProtocol = true
        }
        maven { url "https://kotlin.bintray.com/kotlinx/" }
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath 'com.google.firebase:firebase-appdistribution-gradle:3.0.1'
        classpath 'org.jetbrains.dokka:dokka-gradle-plugin:1.8.20'
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.25.3'
        classpath 'app.cash.licensee:licensee-gradle-plugin:1.7.0'
        classpath 'app.cash.paparazzi:paparazzi-gradle-plugin:1.3.0'

    }
}



task clean(type: Delete) {
    delete rootProject.buildDir
}